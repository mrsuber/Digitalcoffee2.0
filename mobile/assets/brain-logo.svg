<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for brain -->
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer ring gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#ringGradient)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>

  <!-- Brain outline - simplified stylized brain -->
  <g filter="url(#glow)">
    <!-- Left hemisphere -->
    <path d="M 70 60
             Q 50 65, 45 80
             Q 42 95, 48 110
             Q 52 125, 62 135
             Q 72 145, 85 148
             Q 85 140, 85 130
             Q 83 115, 80 100
             Q 77 85, 75 70
             Q 73 62, 70 60 Z"
          fill="url(#brainGradient)" opacity="0.9"/>

    <!-- Right hemisphere -->
    <path d="M 130 60
             Q 150 65, 155 80
             Q 158 95, 152 110
             Q 148 125, 138 135
             Q 128 145, 115 148
             Q 115 140, 115 130
             Q 117 115, 120 100
             Q 123 85, 125 70
             Q 127 62, 130 60 Z"
          fill="url(#brainGradient)" opacity="0.9"/>

    <!-- Center connection corpus callosum -->
    <ellipse cx="100" cy="100" rx="15" ry="45" fill="url(#brainGradient)" opacity="0.7"/>

    <!-- Brain folds/details - left -->
    <path d="M 55 75 Q 60 80, 55 85" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 58 90 Q 63 95, 58 100" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 62 105 Q 67 110, 62 115" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Brain folds/details - right -->
    <path d="M 145 75 Q 140 80, 145 85" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 142 90 Q 137 95, 142 100" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 138 105 Q 133 110, 138 115" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Waveform through brain center -->
  <g filter="url(#glow)">
    <path d="M 30 100
             L 45 100
             L 55 85
             L 65 115
             L 75 90
             L 85 110
             L 100 100
             L 115 90
             L 125 110
             L 135 85
             L 145 115
             L 155 100
             L 170 100"
          stroke="#06b6d4"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"
          opacity="0.8"/>
  </g>

  <!-- Center glow point -->
  <circle cx="100" cy="100" r="8" fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
</svg>
