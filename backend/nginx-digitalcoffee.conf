# Nginx configuration for digitalcoffee.cafe
# Place this file in /etc/nginx/sites-available/digitalcoffee
# Then create symlink: sudo ln -s /etc/nginx/sites-available/digitalcoffee /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name digitalcoffee.cafe www.digitalcoffee.cafe;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digitalcoffee.cafe www.digitalcoffee.cafe;

    # SSL Configuration (Certbot will modify this section)
    ssl_certificate /etc/letsencrypt/live/digitalcoffee.cafe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digitalcoffee.cafe/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/digitalcoffee-access.log;
    error_log /var/log/nginx/digitalcoffee-error.log;

    # Proxy settings for backend API
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (optional)
    location /health {
        proxy_pass http://localhost:5000/health;
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
}
